<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00040e">
  <meta name="jiveshooter-build" content="V5-PAGES-FIX-20260811">
  <title>JIVESHOOTER</title>
  <link rel="stylesheet" href="./style-v4-20260811.css?v=5-pages-fix-20260811">
  <style>
    #pagesBuildMarker{position:fixed;right:6px;bottom:4px;z-index:2147483647;font:9px monospace;color:rgba(170,255,255,.28);pointer-events:none;user-select:none}
  </style>
</head>
<body>
  <main id="gameShell">
    <canvas id="gameCanvas" aria-label="JIVESHOOTER game"></canvas>
    <canvas id="fxCanvas" aria-hidden="true"></canvas>

    <section id="hud" aria-live="polite">
      <div id="logoWrap">
        <img id="logo" alt="JIVESHOOTER">
      </div>
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">Lives: <span id="lives">5</span></div>
      <div class="stat">Wave: <span id="wave">1</span></div>
      <small>
        Arrow keys or A/D move. Space fires. P pauses.
        Mouse and touch also work.
      </small>
      <div id="status">Loading JIVESHOOTER V5 assets...</div>
      <div class="buttons">
        <button id="restart" type="button">Restart</button>
        <button id="pause" type="button">Pause</button>
      </div>
    </section>

    <section id="startPanel" class="panel">
      <img id="startLogo" alt="JIVESHOOTER">
      <p>Neon formation assault.</p>
      <button id="start" type="button">START GAME</button>
    </section>
  </main>

  <div id="pagesBuildMarker">V5 PAGES FIX</div>
  <script src="./game-v4-20260811.js?v=5-pages-fix-20260811"></script>
</body>
</html>
